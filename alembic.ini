# AI HOSPITAL ALLIANCE
# Canonical Alembic configuration.
#
# Database authority is intentionally NOT stored in this file.
#
# Any command that requires a database connection must receive:
#
#   AIHA_ALEMBIC_DATABASE_URL
#
# Supply the complete canonical database DSN only through the
# AIHA_ALEMBIC_DATABASE_URL environment variable at execution time.
#
# Never commit a real database credential or canonical DSN here.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
